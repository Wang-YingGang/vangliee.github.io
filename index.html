<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>笔记</title>
    <meta name="description" content="个人笔记站点" />
    <meta name="author" content="Wang YingGang" />
    <meta name="theme-color" content="#ffffff" id="theme-color" />

    <!-- 站点地址：GitHub Pages 项目页，部署在子路径下，因此站内资源一律使用相对路径 -->
    <link rel="canonical" href="https://wang-yinggang.github.io/vangliee.github.io/" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="favicon.ico" />

    <!-- 分享卡片 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="笔记" />
    <meta property="og:title" content="笔记" />
    <meta property="og:description" content="个人笔记站点" />
    <meta property="og:url" content="https://wang-yinggang.github.io/vangliee.github.io/" />
    <meta name="twitter:card" content="summary" />

    <!-- 首屏先定好明暗，避免刷新时闪白 -->
    <script>
        (function () {
            var KEY = 'notes-theme';
            var saved = null;
            try { saved = localStorage.getItem(KEY); } catch (e) { /* 隐私模式下忽略 */ }
            var dark = saved
                ? saved === 'dark'
                : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        })();
    </script>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- 主题：docsify 5 的 core 主题，颜色全部走 CSS 变量，见 _assets/style.css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5.1.0/dist/themes/core.min.css" />
    <link rel="stylesheet" href="_assets/style.css" />
</head>

<body>
    <div id="app">正在加载…</div>

    <script>
        window.$docsify = {
            // 站点名称，显示在侧边栏顶部
            name: '笔记',
            // 右上角 GitHub 入口（指向本站仓库，而不是个人主页）
            repo: 'https://github.com/Wang-YingGang/vangliee.github.io',

            // 三个约定文件：_coverpage.md / _navbar.md / _sidebar.md
            coverpage: true,
            loadNavbar: true,
            loadSidebar: true,

            // 小屏下把导航栏收进侧边栏
            mergeNavbar: true,
            // 切换页面后自动回到顶部
            auto2top: true,
            // 标题最多渲染到 h4，侧边栏目录展开到二级
            maxLevel: 4,
            subMaxLevel: 2,

            search: {
                paths: 'auto',
                placeholder: '搜索',
                noData: '没有找到相关内容',
                depth: 3,
                maxAge: 86400000,
                hideOtherSidebarContent: true,
                namespace: 'notes'
            }
        };
    </script>

    <!-- docsify 本体；jsDelivr 不可用时回退到 unpkg -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@5.1.0/dist/docsify.min.js"></script>
    <script>
        window.Docsify || document.write('<script src="https://unpkg.com/docsify@5.1.0/dist/docsify.min.js"><\/script>');
    </script>

    <!-- 搜索 -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@5.1.0/dist/plugins/search.min.js"></script>
    <!-- 图片点击放大 -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@5.1.0/dist/plugins/zoom-image.min.js"></script>

    <!-- 站点脚本：明暗主题、代码复制、回到顶部 -->
    <script src="_assets/site.js"></script>
</body>

</html>
